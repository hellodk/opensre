apiVersion: batch/v1
kind: Job
metadata:
  name: cpu-hog
  namespace: chaos-load
spec:
  # Self-terminating: worst case it burns its CPU budget for 5 minutes.
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null http://store-api-gateway.prod.svc.cluster.local:8080/ || true;
              done
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
